<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Tripownia</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #fbfaf7; color: #141414; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); }
      .card { width: min(100%, 420px); text-align: center; }
      .brand { display: inline-flex; align-items: baseline; gap: 2px; font-size: 32px; font-weight: 900; letter-spacing: -1.5px; }
      .brand b { color: #ff4b22; }
      h1 { margin: 28px 0 10px; font-size: clamp(26px, 8vw, 38px); line-height: 1.03; letter-spacing: -1.4px; }
      p { margin: 0 auto; max-width: 340px; color: #6d6d69; line-height: 1.55; }
      .loader { width: 42px; height: 42px; margin: 30px auto 24px; border: 4px solid #e8e5df; border-top-color: #ff4b22; border-radius: 999px; animation: spin .8s linear infinite; }
      a { display: inline-flex; margin-top: 18px; padding: 13px 18px; border-radius: 999px; background: #161616; color: #fff; text-decoration: none; font-weight: 800; }
      small { display: block; margin-top: 20px; color: #8a8881; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loader { animation: none; border-top-color: #e8e5df; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-live="polite">
        <div class="brand">Tripownia<b>.pl</b></div>
        <h1>Łączymy Cię z Tripownią.</h1>
        <p>Sprawdzamy aktualne oferty i przygotowujemy Twój ekran podróży.</p>
        <div class="loader" aria-hidden="true"></div>
        <a href="https://tripownia.pl/app">Otwórz aplikację</a>
        <small>Jeśli połączenie jest słabe, spróbuj ponownie za chwilę.</small>
      </section>
    </main>
  </body>
</html>
