<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Tripownia — sprawdź połączenie</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #fbfaf7; color: #141414; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); }
      section { max-width: 380px; text-align: center; }
      .brand { font-size: 30px; font-weight: 900; }
      .brand span { color: #ff4b22; }
      h1 { font-size: 28px; line-height: 1.15; }
      p { color: #6d6d69; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 24px; background: #161616; color: #fff; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #ff4b22; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="brand">Tripownia<span>.pl</span></div>
        <h1>Nie możemy teraz otworzyć Tripowni.</h1>
        <p>Sprawdź połączenie z internetem i spróbuj ponownie za chwilę.</p>
        <a href="https://tripownia.pl/app">Spróbuj ponownie</a>
      </section>
    </main>
  </body>
</html>
