<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f4">
  <title>Tripownia — brak połączenia</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fbf8f4;color:#14213d;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 22px}
    section{width:min(100%,420px);background:#fff;border:1px solid #ece7df;border-radius:28px;padding:30px;text-align:center;box-shadow:0 18px 50px rgba(20,33,61,.08)}
    .mark{font-size:42px}
    h1{font-size:27px;line-height:1.08;margin:18px 0 10px}
    p{color:#69717f;line-height:1.55;margin:0}
    a{display:inline-flex;margin-top:22px;padding:13px 20px;border-radius:999px;background:#14213d;color:#fff;text-decoration:none;font-weight:800}
    small{display:block;margin-top:14px;color:#9299a5}
  </style>
</head>
<body>
  <main>
    <section>
      <div class="mark" aria-hidden="true">✈️</div>
      <h1>Brak połączenia z internetem</h1>
      <p>Tripownia nie pokaże starej wersji Twojego konta ani planu. Połącz się z internetem i odśwież aktualne dane.</p>
      <a href="/app">Spróbuj ponownie</a>
      <small>Twoje lokalnie zapisane dane pozostają na urządzeniu.</small>
    </section>
  </main>
</body>
</html>
