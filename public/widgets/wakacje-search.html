<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Wyszukiwarka Wakacje.pl</title><style>html,body{margin:0;padding:0;background:#fff;color:#26211e;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}*{box-sizing:border-box}
#search-widget89{width:100%;background:#fff;color:#26211e;--primary:#f4512c;--primary-color:#f4512c;--color-primary:#f4512c;--brand-primary:#f4512c;--accent:#f4512c;--accent-color:#f4512c}
#search-widget89 button[type=submit],#search-widget89 input[type=submit]{background-color:#f4512c!important;border-color:#f4512c!important;color:#fff!important}
#search-widget89 button[type=submit]:hover,#search-widget89 input[type=submit]:hover{background-color:#d94426!important;border-color:#d94426!important}
#search-widget89 :is(button,input,select):focus-visible{outline:2px solid #f4512c;outline-offset:2px}
#search-widget89 a[href*="/wczasy/"]{display:flex!important;align-items:center;justify-content:center;min-height:48px;max-width:100%;padding:14px 20px!important;background:#e84a27!important;border-color:#e84a27!important;color:#fff!important;white-space:normal!important;border-radius:12px!important}
</style></head><body>
<div id="search-widget89" data-widget="search" data-branding="false" data-show-title="false" data-affiliate="3212" data-campaign="3212-tripownia.pl"></div>
<script src="https://widget.wakacje.pl/v2/public/js/widgets/search-widget-v2.js?c=search-widget89" async></script>

<script>
/* Partner widget retains its original script and affiliate ID; report wrapper height only. */
(function(){
  var scheduled=false;
  function measure(){
    scheduled=false;
    var el=document.getElementById('search-widget89');
    var dialogs=Array.from(document.querySelectorAll('[role="dialog"],[aria-modal="true"],[class*="modal"],[class*="Modal"],[class*="popover"],[class*="Popover"]')).filter(function(node){var r=node.getBoundingClientRect();var st=getComputedStyle(node);return r.width>150&&r.height>120&&st.display!=="none"&&st.visibility!=="hidden";});
    var popupBottom=dialogs.reduce(function(max,node){return Math.max(max,node.getBoundingClientRect().bottom+window.scrollY+48);},0);
    var h=Math.max(el?el.getBoundingClientRect().bottom+window.scrollY:0,popupBottom,220);
    window.parent.postMessage({type:'tripownia:wk-widget-height',height:Math.ceil(h)},window.location.origin);
  }
  function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(measure);}
  if(window.ResizeObserver){new ResizeObserver(schedule).observe(document.body);}
  if(window.MutationObserver){new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','aria-expanded','aria-hidden']});}
  document.addEventListener('click',function(){setTimeout(schedule,60);setTimeout(schedule,250);},true);
  document.addEventListener('focusin',schedule,true);
  window.addEventListener('resize',schedule);
  window.addEventListener('load',schedule);
  setTimeout(schedule,350);setTimeout(schedule,1500);setTimeout(schedule,3500);
})();
</script>
</body></html>
