name: Refresh live offers snapshot

on:
  schedule:
    # 04:35 UTC = 06:35 in Poland during CEST. Fresh offers are ready before 07:00.
    - cron: "35 4 * * *"
    # Midday safety refresh catches price/availability changes from partner feeds.
    - cron: "10 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-offers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate current offers
        shell: bash
        run: |
          set -euo pipefail
          base="https://tripownia.pl/api/today-offers?mode=search&broad=1&rescue=full"

          fetch_provider() {
            provider="$1"
            output="$2"
            if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90               -H 'Accept: application/json'               "$base&provider=$provider" > "$output"; then
              echo "Provider $provider unavailable; keeping other healthy feeds."
              printf '%s\n' '{"ok":false,"offers":[]}' > "$output"
            fi
          }

          fetch_provider exim /tmp/live-offers-exim.json
          fetch_provider tui /tmp/live-offers-tui.json

          python3 - <<'PY'
          import json
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          sources = [
              ("exim", "/tmp/live-offers-exim.json"),
              ("tui", "/tmp/live-offers-tui.json"),
          ]
          dst = "data/live-offers-snapshot.json"

          datasets = []
          buckets = defaultdict(deque)
          seen = set()

          for provider, path in sources:
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception:
                  data = {"ok": False, "offers": []}

              datasets.append(data)
              for offer in data.get("offers") or []:
                  price = offer.get("price")
                  link = offer.get("affiliateUrl") or offer.get("url")
                  if not isinstance(price, (int, float)) or price <= 0 or not link:
                      continue

                  actual_provider = str(offer.get("partner") or provider).lower()
                  dedupe_key = (
                      actual_provider,
                      str(offer.get("id") or ""),
                      str(offer.get("hotel") or ""),
                      str(offer.get("dates") or ""),
                      str(link),
                  )
                  if dedupe_key in seen:
                      continue
                  seen.add(dedupe_key)
                  buckets[actual_provider].append(offer)

          total_valid = sum(len(items) for items in buckets.values())
          if total_valid < 30:
              raise SystemExit(f"Refusing snapshot: only {total_valid} valid offers across feeds")

          provider_order = [name for name in ("exim", "tui") if buckets.get(name)]
          provider_order += sorted(name for name in buckets if name not in provider_order)

          selected = []
          while len(selected) < 200 and any(buckets[name] for name in provider_order):
              for name in provider_order:
                  if buckets[name]:
                      selected.append(buckets[name].popleft())
                      if len(selected) >= 200:
                          break

          checked_values = [
              str(data.get("checkedAt"))
              for data in datasets
              if data.get("checkedAt")
          ]
          destinations = {
              (str(offer.get("city") or "").strip().lower(), str(offer.get("country") or "").strip().lower())
              for offer in selected
              if offer.get("city") or offer.get("country")
          }
          if len(destinations) < 12:
              raise SystemExit(f"Refusing snapshot: only {len(destinations)} unique destinations")

          destination_counts = {}
          for offer in selected:
              key = (
                  str(offer.get("city") or "").strip().lower(),
                  str(offer.get("country") or "").strip().lower(),
              )
              destination_counts[key] = destination_counts.get(key, 0) + 1
          max_destination_share = max(destination_counts.values(), default=0) / max(1, len(selected))
          if len(selected) >= 40 and max_destination_share > 0.30:
              raise SystemExit(f"Refusing snapshot: one destination is {max_destination_share:.0%} of the pool")

          snapshot = {
              "ok": True,
              "checkedAt": max(checked_values) if checked_values else None,
              "snapshotAt": datetime.now(timezone.utc).isoformat(),
              "sourceCount": sum(int(data.get("sourceCount") or 0) for data in datasets),
              "destinationCount": len(destinations),
              "quality": {
                  "uniqueDestinations": len(destinations),
                  "maxDestinationShare": round(max_destination_share, 4),
              },
              "providerCounts": {
                  name: sum(1 for offer in selected if str(offer.get("partner") or "").lower() == name)
                  for name in provider_order
              },
              "offers": selected,
          }

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(snapshot, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(
              "Validated",
              total_valid,
              "offers; snapshot:",
              len(selected),
              "providers:",
              snapshot["providerCounts"],
          )
          PY

      - name: Commit snapshot only when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/live-offers-snapshot.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "tripownia-offers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-offers-snapshot.json
          git commit -m "chore: refresh live offers snapshot"
          git push
