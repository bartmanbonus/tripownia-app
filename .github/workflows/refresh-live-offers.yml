name: Refresh live offers snapshot
on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "10 7 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-live-offers
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Warsaw schedule (delay-tolerant)
        id: warsaw
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { shouldRefresh } from './scripts/refresh-core.ts';
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${shouldRefresh(process.env.EVENT_NAME, process.env.SCHEDULE)}\n`);
          JS
      - name: Fetch every export page and validate before replacing snapshot
        id: refresh
        if: steps.warsaw.outputs.run == 'true'
        continue-on-error: true
        run: node --experimental-strip-types scripts/refresh-live-offers.mjs
      - name: Save snapshot or failure status
        if: always() && steps.warsaw.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "tripownia-offers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-offers-snapshot.json
          if [ -f data/refresh-status.json ]; then git add data/refresh-status.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record live catalog refresh"
          git push
      - name: Report failed refresh
        if: always() && steps.refresh.outcome == 'failure'
        run: exit 1
