name: Android release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor build tooling
        run: npm install --no-save @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android


      - name: Set Android app version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          code = int(os.environ["VERSION_CODE"])
          text = re.sub(r"versionCode\s+\d+", f"versionCode {code}", text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "0.1.{code}"', text)
          path.write_text(text, encoding="utf-8")
          print(f"Tripownia Android versionCode={code}, versionName=0.1.{code}")
          PY

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/tripownia-upload.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore /tmp/tripownia-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tripownia-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
