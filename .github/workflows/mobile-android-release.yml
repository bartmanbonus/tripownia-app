name: Mobile Android Release Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-release.yml'

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify mobile shell
        run: test -f www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release AAB
        run: ./android/gradlew -p android bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: tripownia-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
