name: Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/native-mobile-app
    paths:
      - 'mobile/**'
      - 'public/tripownia-logo.webp'
      - '.github/workflows/mobile-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify mobile shell
        run: test -f www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare branded Tripownia launcher assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          mkdir -p assets

          # Launcher icons should use the pictorial mark, not the tiny wordmark.
          convert ../public/tripownia-logo.webp \
            -crop 1920x1450+0+0 +repage \
            -trim +repage \
            -resize 760x760 \
            -gravity center \
            -background white \
            -extent 1024x1024 \
            assets/icon-only.png

          convert ../public/tripownia-logo.webp \
            -crop 1920x1450+0+0 +repage \
            -trim +repage \
            -resize 650x650 \
            -gravity center \
            -background none \
            -extent 1024x1024 \
            assets/icon-foreground.png

          convert -size 1024x1024 xc:white assets/icon-background.png

      - name: Generate Android app assets
        run: npm run assets -- --android

      - name: Fix adaptive launcher icon references
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tripownia-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
