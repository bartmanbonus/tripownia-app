name: Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/native-mobile-app
    paths:
      - 'mobile/**'
      - 'public/tripownia-logo.webp'
      - '.github/workflows/mobile-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify mobile shell
        run: test -f www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare Tripownia launcher icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert ../public/tripownia-logo.webp -resize 900x900 -gravity center -background none -extent 1024x1024 assets/icon-only.png

      - name: Generate Android app assets
        run: npm run assets -- --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tripownia-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
