name: Publish Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      version_code:
        description: Android versionCode (use the next small integer, e.g. 2, 3, 4; must be higher than every version already uploaded to Play)
        required: true
        default: '2'
        type: string
      version_name:
        description: User-facing Android version
        required: true
        default: '1.0.1'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Android version
        run: |
          set -euo pipefail
          if [[ ! "$ANDROID_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must be an integer"
            exit 1
          fi
          if (( ANDROID_VERSION_CODE < 2 || ANDROID_VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must be between 2 and 2100000000"
            exit 1
          fi
          if [[ -z "$ANDROID_VERSION_NAME" ]]; then
            echo "::error::version_name cannot be empty"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          version_code = os.environ["ANDROID_VERSION_CODE"]
          version_name = os.environ["ANDROID_VERSION_NAME"]

          text, code_count = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              lambda m: f"{m.group(1)}versionCode {version_code}",
              text,
              count=1,
          )
          text, name_count = re.subn(
              r'(?m)^(\s*)versionName\s+"[^"]*"\s*$',
              lambda m: f'{m.group(1)}versionName "{version_name}"',
              text,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update versionCode/versionName in android/app/build.gradle")

          path.write_text(text, encoding="utf-8")
          PY
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Generate Tripownia Android icons
        run: |
          mkdir -p assets
          cp ../public/tripownia-app-icon-v2.png assets/icon.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Build release bundle
        run: ./android/gradlew -p android bundleRelease

      - name: Restore Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Sign Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      - name: Validate signature
        run: jarsigner -verify -strict -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Create Play service-account file
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: mobile/play-service-account.json
          packageName: pl.tripownia.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripownia-google-play-signed-aab-${{ inputs.version_code }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
