name: CI

on:
  pull_request:
    branches: [main, 'ux/dream-home-20260920']
  push:
    branches:
      - main
      - feature/**
      - chore/**

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary outbound link encryption key for CI only
        run: echo "TRIPOWNIA_AFFILIATE_LINK_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate project
        run: npm run validate

      - name: Production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test Tripownia sales path
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test production routes
        shell: bash
        run: |
          npm run start > /tmp/tripownia-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Next.js server did not become ready"
            cat /tmp/tripownia-next.log
            exit 1
          fi

          routes=(
            "/"
            "/app"
            "/okazje"
            "/kierunki"
            "/wakacje"
            "/radar-tripowni"
            "/konto"
            "/gdzie-leciec"
            "/dla-ciebie"
            "/moja-podroz"
            "/moje-podroze"
            "/dodaj-podroz"
            "/porownaj"
            "/alerty"
            "/profil"
            "/ulubione"
            "/transfery"
            "/wynajem-auta"
            "/atrakcje"
            "/parkingi"
            "/esim"
            "/planer-podrozy"
            "/poradniki"
            "/przed-wyjazdem"
            "/polityka-prywatnosci"
            "/sitemap.xml"
            "/robots.txt"
          )

          for route in "${routes[@]}"; do
            status=$(curl --silent --show-error --output /tmp/tripownia-body --write-out "%{http_code}" "http://127.0.0.1:3000${route}")
            echo "${route} -> ${status}"
            if [ "$status" != "200" ]; then
              echo "Unexpected status for ${route}"
              cat /tmp/tripownia-body
              cat /tmp/tripownia-next.log
              exit 1
            fi
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/dodaj-podroz > /tmp/tripownia-planner
          grep -q "Plan 0 zł" /tmp/tripownia-planner
          grep -q "bez obowiązkowego konta" /tmp/tripownia-planner
          # Step 1 is server-rendered; "Gdziekolwiek" appears only in step 2 after a client interaction.
          grep -q "Wybierz kierunek i termin" /tmp/tripownia-planner

          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/tripownia-home
          if grep -q "NETFLIX PODRÓŻY" /tmp/tripownia-home; then
            echo "Legacy homepage copy returned"
            exit 1
          fi

          node scripts/verify-seo.mjs
